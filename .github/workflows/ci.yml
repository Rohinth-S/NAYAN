name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run check

  server-and-evaluation:
    name: Server and evaluation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        working-directory: server
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run server tests
        working-directory: server
        run: python -m pytest
      - name: Run server lint
        working-directory: server
        run: python -m ruff check .
      - name: Run evaluation tests
        run: PYTHONPATH=evaluation python -m pytest evaluation/tests -q
