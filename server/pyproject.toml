[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sih-privacy-reasoning-server"
version = "0.1.0"
description = "Strict sanitized-context reasoning boundary for SIH26171"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.119.1",
    "httpx==0.28.1",
    "pillow==11.3.0",
    "pydantic==2.12.0",
    "uvicorn[standard]==0.37.0",
]

[project.optional-dependencies]
test = [
    "hypothesis==6.126.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.14.14",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "UP", "RUF"]
