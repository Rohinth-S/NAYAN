<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic PAN card</title>
  <desc id="desc">Synthetic Indian PAN card artwork containing a name, date of birth, and PAN identifier. The generated portrait is layered by the host page for cross-browser rendering.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#e9eef7"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#5275a7" stroke-opacity=".1"/>
    </pattern>
  </defs>
  <rect x="8" y="8" width="744" height="454" rx="16" fill="url(#paper)" stroke="#9aaaca" stroke-width="4"/>
  <rect x="8" y="8" width="744" height="454" rx="16" fill="url(#grid)"/>
  <rect x="8" y="8" width="744" height="78" rx="16" fill="#1c3a68"/>
  <rect x="8" y="62" width="744" height="24" fill="#1c3a68"/>
  <circle cx="56" cy="47" r="25" fill="#e4b85e"/>
  <path d="M45 46h22M56 35v24" stroke="#1c3a68" stroke-width="4"/>
  <text x="96" y="42" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">INCOME TAX DEPARTMENT</text>
  <text x="96" y="67" fill="#cddcf4" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">SYNTHETIC PAN CARD · DEMO FIXTURE</text>
  <rect x="48" y="126" width="148" height="190" rx="8" fill="#cad7e7"/>
  <rect x="48" y="126" width="148" height="190" rx="8" fill="none" stroke="#8298b8" stroke-width="3"/>
  <text x="238" y="142" fill="#60708d" font-family="Arial,sans-serif" font-size="14" font-weight="700">PERMANENT ACCOUNT NUMBER</text>
  <text x="238" y="183" fill="#182c4d" font-family="Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="4">ABCDE1234F</text>
  <text x="238" y="236" fill="#60708d" font-family="Arial,sans-serif" font-size="14" font-weight="700">NAME</text>
  <text x="238" y="273" fill="#182c4d" font-family="Arial,sans-serif" font-size="26" font-weight="700">AARAV SHARMA</text>
  <text x="238" y="325" fill="#60708d" font-family="Arial,sans-serif" font-size="14" font-weight="700">DATE OF BIRTH</text>
  <text x="238" y="360" fill="#182c4d" font-family="Arial,sans-serif" font-size="23">14/08/1998</text>
  <text x="48" y="410" fill="#526887" font-family="Arial,sans-serif" font-size="14" letter-spacing="1">FOR LOCAL PRIVACY-REDACTION TESTING ONLY</text>
  <text x="48" y="437" fill="#526887" font-family="Arial,sans-serif" font-size="12">THIS IMAGE DOES NOT REPRESENT A REAL GOVERNMENT DOCUMENT</text>
</svg>
