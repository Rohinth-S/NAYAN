<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Aadhaar-style privacy test card</title>
  <desc id="desc">A fictional India-inspired identity document used to test selective local redaction. The generated portrait is layered by the host page for cross-browser rendering. It is not an official Aadhaar card or government document.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf5fb"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2b6b91" stroke-opacity=".07"/>
    </pattern>
    <pattern id="qr" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#fff"/>
      <path d="M0 0h7v7H0zM11 0h7v7h-7zM0 11h7v7H0zM9 9h3v3H9zM14 12h4v3h-4zM10 15h3v3h-3z" fill="#103d61"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="984" height="704" rx="26" fill="url(#paper)" stroke="#8aaeca" stroke-width="4"/>
  <rect x="8" y="8" width="984" height="704" rx="26" fill="url(#grid)"/>

  <!-- India-inspired tricolour accent; branding is intentionally fictional. -->
  <rect x="10" y="10" width="980" height="13" rx="7" fill="#f39a43"/>
  <rect x="337" y="10" width="326" height="13" fill="#fff"/>
  <rect x="663" y="10" width="327" height="13" rx="7" fill="#4a9b67"/>

  <rect x="10" y="23" width="980" height="122" fill="#fff" fill-opacity=".94"/>
  <path d="M10 145H990" stroke="#9dbbd0" stroke-width="2"/>
  <g transform="translate(45 53)">
    <circle cx="42" cy="35" r="32" fill="#0c4677"/>
    <circle cx="42" cy="35" r="22" fill="none" stroke="#f3b34c" stroke-width="3" stroke-dasharray="2 5"/>
    <circle cx="42" cy="35" r="5" fill="#fff"/>
    <path d="M42 8v54M15 35h54M23 16l38 38M61 16 23 54" stroke="#fff" stroke-width="2" opacity=".8"/>
    <text x="90" y="28" fill="#113e63" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="2">INDIA RESIDENT ID</text>
    <text x="90" y="56" fill="#47728e" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">AADHAAR-STYLE PRIVACY TEST FIXTURE</text>
    <text x="90" y="82" fill="#6a8496" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.2">SYNTHETIC DOCUMENT · SIH26171</text>
  </g>
  <g text-anchor="end" font-family="Arial,sans-serif">
    <text x="948" y="74" fill="#b2503d" font-size="14" font-weight="800" letter-spacing="1.8">NOT A REAL ID</text>
    <text x="948" y="101" fill="#52748c" font-size="12" font-weight="700" letter-spacing="1.3">PRIVACY LAB / DEMO</text>
  </g>

  <text x="58" y="176" fill="#3b6782" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.4">PHOTO IDENTITY</text>
  <rect x="58" y="193" width="220" height="276" rx="14" fill="#d7e5f0"/>
  <rect x="58" y="193" width="220" height="276" rx="14" fill="none" stroke="#88a8bf" stroke-width="3"/>
  <text x="68" y="505" fill="#456a82" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1">SYNTHETIC PORTRAIT</text>
  <text x="68" y="530" fill="#607d95" font-family="Arial,sans-serif" font-size="12">fictional · local redaction test</text>
  <rect x="58" y="558" width="220" height="74" rx="11" fill="#e8f1f7" stroke="#b0c8d8"/>
  <text x="76" y="587" fill="#4b728b" font-family="Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1">DOCUMENT CLASS</text>
  <text x="76" y="612" fill="#16496d" font-family="Arial,sans-serif" font-size="14" font-weight="700">SYNTHETIC / TEST ONLY</text>

  <g fill="#173f60" font-family="Arial,sans-serif">
    <text x="330" y="178" font-size="12" font-weight="800" letter-spacing="1.6" fill="#5b7d92">IDENTITY DETAILS</text>
    <path d="M330 190H937" stroke="#aec6d5"/>
    <text x="330" y="231" font-size="20" font-weight="800" letter-spacing="1.2">NAME: KAVYA MENON</text>
    <text x="330" y="291" font-size="20" font-weight="800" letter-spacing="1.2">DATE OF BIRTH: 17/05/1997</text>
    <text x="330" y="351" font-size="20" font-weight="800" letter-spacing="1.2">GENDER: FEMALE</text>
    <text x="330" y="411" font-size="20" font-weight="800" letter-spacing="1.2">MOBILE: +91 98765 43210</text>
    <text x="330" y="471" font-size="20" font-weight="800" letter-spacing="1.2">ADDRESS: 42 ORBIT AVENUE, BENGALURU</text>
    <text x="330" y="541" font-size="20" font-weight="800" letter-spacing="1.2">AADHAAR NUMBER: 9876 5432 1098</text>
  </g>

  <rect x="330" y="570" width="430" height="78" rx="12" fill="#dcecf5" stroke="#a8c3d4"/>
  <text x="354" y="600" fill="#426a83" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.3">LOCAL REDACTION TEST</text>
  <text x="354" y="625" fill="#5b7487" font-family="Arial,sans-serif" font-size="12">Keep the layout; replace only PII lines locally.</text>
  <rect x="790" y="570" width="147" height="78" rx="7" fill="url(#qr)" stroke="#8aaeca" stroke-width="2"/>
  <rect x="802" y="582" width="123" height="54" fill="#fff" fill-opacity=".08"/>
  <text x="855" y="665" text-anchor="middle" fill="#55788d" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1">DEMO MARKER</text>

  <path d="M58 676H942" stroke="#a9c1d1"/>
  <text x="58" y="697" fill="#52738a" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">SYNTHETIC DATA · FOR SIH26171 DEMONSTRATION ONLY · NOT ISSUED BY ANY AUTHORITY</text>
</svg>
