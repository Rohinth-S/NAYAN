<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanitized preview · Private Browser Agent</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <main class="viewer">
      <header class="viewer-header">
        <div>
          <p class="eyebrow">LOCAL ONLY · NO DATA SENT</p>
          <h1>Sanitized page preview</h1>
          <p>Sensitive regions were replaced on this device before the preview was made available.</p>
        </div>
        <span class="local-pill"><i></i> Local filter active</span>
      </header>
      <section class="stage" aria-live="polite">
        <p id="message">Loading local preview…</p>
        <div id="preview-container" class="preview-container" hidden>
          <div class="metrics-panel">
            <h3>Privacy Metrics</h3>
            <p><strong>Masked Area:</strong> <span id="masked-area-stat">0</span>%</p>
            <div id="category-counts-container"></div>
            <p class="why-hidden-tooltip" title="Categories are detected locally using ONNX/WASM or regex. No data leaves the device until verified.">ℹ️ Why is this hidden?</p>
          </div>
          <div class="image-panel">
            <img id="preview" alt="Sanitized page preview" />
          </div>
        </div>
      </section>
      <footer><span>Nothing on this page is sent to the reasoning server.</span><button id="close" type="button">Close tab</button></footer>
    </main>
    <script src="preview.js"></script>
  </body>
</html>
